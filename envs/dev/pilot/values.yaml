# Desired state of the pilot workload in apps-dev (T032 fixture).
#
# The ONLY release variable is the immutable image digest below. Rules of this
# repository apply (README.md): no `latest`, no floating tags — the digest is
# replaced by the trusted finalizer (T033) or, until then, by a manual GitOps
# MR; see examples/gitops-mr-digest-change.md for the exact shape.
replicaCount: 1

image:
  repository: busybox
  # Immutable digest (ADR-015 п.5).
  # promote: first digest promotion (TD-020 bring-up, DoD T-043 GitOps chain).
  # Fixture image, not factory-built: busybox:1.37 multi-arch index digest,
  # the same digest pinned in dark-factory-mvp deploy/ci manifests (T030).
  # product_commit/run — N/A until the trusted finalizer (T033) takes over.
  digest: "sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0"

# Minimal footprint inside the apps-dev admission posture (T029: ResourceQuota
# requests 500m/1Gi, limits 1 CPU/2Gi) and the deny-by-default egress posture
# (no external network access is needed to sleep).
#
# The bootstrap LimitRange of apps-dev enforces per-container minimums of
# 25m CPU / 32Mi (TD-025): requests below them reject the pod at admission
# even though the namespace quota would allow it. requests sit at the
# minimums on purpose — the conformance test in tests/test_deploy_argocd.py
# parses them from deploy/bootstrap/manifests/quotas.yaml, so a platform-side
# minimum bump fails the seed validation instead of the live deploy.
command: ["sleep", "infinity"]
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 50m
    memory: 32Mi
